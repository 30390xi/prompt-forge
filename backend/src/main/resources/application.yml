server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/prompt_forge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

llm:
  base-url: https://api.deepseek.com
  # 可在 UI「设置(模型)」中配置；也可在此填写或使用环境变量 LLM_API_KEY
  api-key: ${LLM_API_KEY:}
  model: deepseek-chat
  timeout-seconds: 120
